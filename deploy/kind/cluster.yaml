# Phase 2, item 6 (ARCHITECTURE.md section 19, ADR-030): a one-node kind cluster for
# deploy/k8s. Only the Gateway is reachable from the host, as in a real deployment:
# NodePort 30080 is mapped to 127.0.0.1:30080 (not 8080, so the Compose stack and this
# cluster can run side by side). Tests reach everything else through kubectl port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: payment-switch
nodes:
  - role: control-plane
    # kind v0.33.0's default node image, pinned by digest (Kubernetes 1.37.0).
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: 127.0.0.1
        protocol: TCP
