# Phase 2, item 3 (ADR-027): compares each bank's statement with the ledger's journals every
# RECON_INTERVAL_MS. One replica (runs are serialized by an advisory lock anyway).
# Mirrors docker-compose.yml service `reconciliation` (tests/unit/k8sManifests.test.ts checks every
# variable). Waits for the same dependencies as its Compose depends_on, with init containers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reconciliation
  labels:
    app.kubernetes.io/name: reconciliation
    app.kubernetes.io/part-of: payment-switch
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_SERVICE_NAME: reconciliation
  LOG_LEVEL: info
  GRPC_PORT: '50053'
  HTTP_PORT: '9104'
  BANK_ENDPOINTS: 'bank_a=bank-a:50061,bank_b=bank-b:50062'
  LEDGER_ADDR: ledger:50052
  RECON_INTERVAL_MS: '300000'
  RECON_SETTLE_MS: '120000'
  RECON_INITIAL_FROM: ''
  RECON_LOOKUP_CONCURRENCY: '16'
---
apiVersion: v1
kind: Secret
metadata:
  name: reconciliation
  labels:
    app.kubernetes.io/name: reconciliation
    app.kubernetes.io/part-of: payment-switch
type: Opaque
stringData:
  DATABASE_URL: postgres://reconciliation:reconciliation@postgres-reconciliation:5432/reconciliation_db
---
apiVersion: v1
kind: Service
metadata:
  name: reconciliation
  labels:
    app.kubernetes.io/name: reconciliation
    app.kubernetes.io/part-of: payment-switch
spec:
  selector:
    app.kubernetes.io/name: reconciliation
  ports:
    - name: grpc
      port: 50053
      targetPort: grpc
      appProtocol: grpc
    - name: http
      port: 9104
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation
  labels:
    app.kubernetes.io/name: reconciliation
    app.kubernetes.io/part-of: payment-switch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reconciliation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reconciliation
        app.kubernetes.io/part-of: payment-switch
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # The image's own `node` user.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres-reconciliation
          image: payment-switch:dev
          imagePullPolicy: Never
          command:
            [
              'sh',
              '-c',
              'until nc -z -w 2 postgres-reconciliation 5432; do echo waiting for postgres-reconciliation:5432; sleep 2; done',
            ]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
        - name: wait-for-ledger
          image: payment-switch:dev
          imagePullPolicy: Never
          command:
            [
              'sh',
              '-c',
              'until wget -q -O /dev/null -T 2 http://ledger:9102/readyz; do echo waiting for ledger ready; sleep 2; done',
            ]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
        - name: wait-for-bank-a
          image: payment-switch:dev
          imagePullPolicy: Never
          command:
            [
              'sh',
              '-c',
              'until wget -q -O /dev/null -T 2 http://bank-a:9111/readyz; do echo waiting for bank-a ready; sleep 2; done',
            ]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
        - name: wait-for-bank-b
          image: payment-switch:dev
          imagePullPolicy: Never
          command:
            [
              'sh',
              '-c',
              'until wget -q -O /dev/null -T 2 http://bank-b:9112/readyz; do echo waiting for bank-b ready; sleep 2; done',
            ]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
      containers:
        - name: reconciliation
          # One image for every service (the repository Dockerfile); SERVICE picks the entry point.
          image: payment-switch:dev
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: reconciliation
            - secretRef:
                name: reconciliation
          env:
            - name: SERVICE
              value: reconciliation
          ports:
            - name: grpc
              containerPort: 50053
            - name: http
              containerPort: 9104
          # /healthz answers once migrations have run and the servers listen.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
