apiVersion: v1
kind: Namespace
metadata:
  name: payment-switch
  labels:
    app.kubernetes.io/part-of: payment-switch
    # Every workload here runs under the "restricted" Pod Security Standard except the
    # Postgres and Kafka images, whose entrypoints need their own users; so enforce
    # "baseline" and warn on anything that is not "restricted".
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
