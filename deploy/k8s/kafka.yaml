# Phase 2, item 1 (ARCHITECTURE.md section 19, ADR-025): single-node KRaft Kafka for the
# outbox relay, mirroring docker-compose.yml service `kafka` with two differences (ADR-030):
# - No EXTERNAL listener. Kafka hands clients its advertised address, and nothing outside
#   the cluster needs the broker, so only `kafka:9092` is advertised.
# - The Service is headless with publishNotReadyAddresses, so `kafka` resolves to the pod
#   before it is ready. The broker reaches its own controller (1@kafka:9093) and its own
#   advertised address during startup, before its readiness probe can pass.
# Nothing on the payment path depends on it: events wait in the outbox while it is down.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: payment-switch
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: payment-switch
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: payment-switch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's own `appuser`.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          env:
            - name: CLUSTER_ID
              value: X2PoAuAbyFHn4z9OX2F02g
            - name: KAFKA_NODE_ID
              value: '1'
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: '1'
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: '1'
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: '1'
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: '0'
            # Topics are created explicitly by the relay, so a misspelt topic fails loudly.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: 'false'
            # The image defaults to a 1 GiB heap; half is plenty for one test topic and
            # keeps the pod well inside its memory limit.
            - name: KAFKA_HEAP_OPTS
              value: -Xmx512m -Xms512m
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          startupProbe:
            exec:
              command:
                [
                  'sh',
                  '-c',
                  '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
                ]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                [
                  'sh',
                  '-c',
                  '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
                ]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 2Gi
