# Phase 2, item 4 (ADR-028): dashboards. Mirrors docker-compose.yml service `grafana`: the
# same image and environment, the provisioning files and the committed dashboard from
# observability/grafana (kustomize configMapGenerators), waits for Prometheus like Compose's
# depends_on. Reach it with `kubectl port-forward svc/grafana 3000` (ClusterIP only).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: payment-switch
data:
  # Development only: anonymous viewers.
  GF_AUTH_ANONYMOUS_ENABLED: 'true'
  GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: payment-switch
type: Opaque
stringData:
  # Development only, from docker-compose.yml; a real deployment injects its own.
  GF_SECURITY_ADMIN_PASSWORD: dev-only-grafana-admin
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: payment-switch
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: payment-switch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: payment-switch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's own `grafana` user.
        runAsUser: 472
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-prometheus
          image: payment-switch:dev
          imagePullPolicy: Never
          command:
            [
              'sh',
              '-c',
              'until wget -q -O /dev/null -T 2 http://prometheus:9090/-/ready; do echo waiting for prometheus ready; sleep 2; done',
            ]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          envFrom:
            - configMapRef:
                name: grafana
            - secretRef:
                name: grafana
          ports:
            - name: web
              containerPort: 3000
          readinessProbe:
            exec:
              command: ['wget', '-qO-', 'http://localhost:3000/api/health']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ['wget', '-qO-', 'http://localhost:3000/api/health']
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          # Grafana writes its SQLite database and plugins under /var/lib/grafana.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards
