# The payment switch stack (ARCHITECTURE.md section 15).
# Each application service is added in the milestone that builds it:
# ledger (M1), bank-a / bank-b (M2), orchestrator (M3), gateway (M4).
#
# Postgres healthchecks use -h 127.0.0.1 on purpose: during first-start initialisation the
# entrypoint runs a temporary server on the unix socket only, so a TCP check cannot report
# healthy until init scripts (initBankDbs.sql) have finished.

name: payment-switch

services:
  postgres-orchestrator:
    image: postgres:16
    environment:
      POSTGRES_USER: orch
      POSTGRES_PASSWORD: orch
      POSTGRES_DB: orchestrator_db
    ports:
      - '5433:5432'
    volumes:
      - orchestrator-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'orch', '-d', 'orchestrator_db']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-ledger:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger_db
    ports:
      - '5434:5432'
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'ledger', '-d', 'ledger_db']
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 2, item 2 (ADR-026): the notification service's own database (ADR-007).
  postgres-notification:
    image: postgres:16
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification_db
    ports:
      - '5436:5432'
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'notification', '-d', 'notification_db']
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 2, item 3 (ADR-027): the reconciliation service's own database (ADR-007).
  postgres-reconciliation:
    image: postgres:16
    environment:
      POSTGRES_USER: reconciliation
      POSTGRES_PASSWORD: reconciliation
      POSTGRES_DB: reconciliation_db
    ports:
      - '5437:5432'
    volumes:
      - reconciliation-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'reconciliation', '-d', 'reconciliation_db']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-banks:
    image: postgres:16
    environment:
      POSTGRES_USER: banks
      POSTGRES_PASSWORD: banks
    ports:
      - '5435:5432'
    volumes:
      - banks-data:/var/lib/postgresql/data
      - ./scripts/initBankDbs.sql:/docker-entrypoint-initdb.d/initBankDbs.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'banks', '-d', 'bank_b']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 2, item 1 (ARCHITECTURE.md section 19, ADR-025): single-node KRaft Kafka for the
  # outbox relay. 3.9.1, not 4.x: kafkajs 2.2.4 predates the protocol versions 4.0 dropped.
  # Two listeners, because Kafka hands clients its advertised address: kafka:9092 inside
  # Compose, localhost:9094 for the host (tests, a native second Orchestrator).
  # Nothing depends on it: payments keep working while it is down (events wait in the outbox).
  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: X2PoAuAbyFHn4z9OX2F02g
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      # Topics are created explicitly by the relay, so a misspelt topic fails loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - '9094:9094'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  ledger:
    build:
      context: .
      args:
        SERVICE: ledger
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: ledger
      LOG_LEVEL: info
      GRPC_PORT: '50052'
      HTTP_PORT: '9102'
      DATABASE_URL: postgres://ledger:ledger@postgres-ledger:5432/ledger_db
    ports:
      - '50052:50052'
      - '9102:9102'
    depends_on:
      postgres-ledger:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9102/readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 2, item 2 (ARCHITECTURE.md section 19, ADR-026): consumes transfer-events,
  # deduplicates by event id, calls a simulated webhook, dead-letters after 5 attempts.
  # It depends on Kafka (it is a Kafka consumer); nothing on the payment path depends on it.
  notification:
    build:
      context: .
      args:
        SERVICE: notification
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: notification
      LOG_LEVEL: info
      HTTP_PORT: '9103'
      DATABASE_URL: postgres://notification:notification@postgres-notification:5432/notification_db
      KAFKA_BROKERS: kafka:9092
      WEBHOOK_RETRY_BASE_MS: '200'
      WEBHOOK_FAILURE_RATE: '0'
      WEBHOOK_SEED: '42'
      WEBHOOK_LATENCY_MS: '0'
    ports:
      - '9103:9103'
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9103/readyz']
      interval: 5s
      timeout: 3s
      retries: 24

  # Phase 2, item 3 (ARCHITECTURE.md section 19, ADR-027): compares each bank's statement
  # with the ledger's journals every RECON_INTERVAL_MS and records the breaks.
  reconciliation:
    build:
      context: .
      args:
        SERVICE: reconciliation
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: reconciliation
      LOG_LEVEL: info
      GRPC_PORT: '50053'
      HTTP_PORT: '9104'
      DATABASE_URL: postgres://reconciliation:reconciliation@postgres-reconciliation:5432/reconciliation_db
      BANK_ENDPOINTS: bank_a=bank-a:50061,bank_b=bank-b:50062
      LEDGER_ADDR: ledger:50052
      RECON_INTERVAL_MS: '300000'
      RECON_SETTLE_MS: '120000'
      RECON_INITIAL_FROM: ''
      RECON_LOOKUP_CONCURRENCY: '16'
    ports:
      - '50053:50053'
      - '9104:9104'
    depends_on:
      postgres-reconciliation:
        condition: service_healthy
      ledger:
        condition: service_healthy
      bank-a:
        condition: service_healthy
      bank-b:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9104/readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 2, item 4 (ARCHITECTURE.md section 19, ADR-028): traces, metrics, dashboards.
  # Nothing depends on these: span export is asynchronous, and a dead Jaeger drops spans,
  # not payments.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    command: ['--config', '/etc/jaeger/config.yaml']
    volumes:
      - ./observability/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - '16686:16686' # UI and query API
      - '4318:4318' # OTLP over HTTP
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:13133/status']
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.7.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=2d']
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      # Development only: anonymous viewers, a throwaway admin password.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: dev-only-grafana-admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30

  # One codebase, two instances. Each owns one database on postgres-banks.
  bank-a:
    build:
      context: .
      args:
        SERVICE: mockBank
    environment: &bank-chaos-defaults
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: bank-a
      LOG_LEVEL: info
      BANK_ID: bank_a
      GRPC_PORT: '50061'
      HTTP_PORT: '9111'
      DATABASE_URL: postgres://banks:banks@postgres-banks:5432/bank_a
      CHAOS_SEED: '42'
      CHAOS_DOWN: 'false'
      CHAOS_LATENCY_MIN_MS: '0'
      CHAOS_LATENCY_MAX_MS: '0'
      CHAOS_REJECT_RATE: '0'
      CHAOS_LATE_APPLY_RATE: '0'
      CHAOS_LOST_RESPONSE_RATE: '0'
      CHAOS_SLOW_MS: '3000'
    ports:
      - '50061:50061'
      - '9111:9111'
    depends_on:
      postgres-banks:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9111/readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  bank-b:
    build:
      context: .
      args:
        SERVICE: mockBank
    environment:
      <<: *bank-chaos-defaults
      OTEL_SERVICE_NAME: bank-b
      BANK_ID: bank_b
      GRPC_PORT: '50062'
      HTTP_PORT: '9112'
      DATABASE_URL: postgres://banks:banks@postgres-banks:5432/bank_b
    ports:
      - '50062:50062'
      - '9112:9112'
    depends_on:
      postgres-banks:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9112/readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  orchestrator:
    build:
      context: .
      args:
        SERVICE: orchestrator
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: orchestrator
      LOG_LEVEL: info
      GRPC_PORT: '50051'
      HTTP_PORT: '9101'
      DATABASE_URL: postgres://orch:orch@postgres-orchestrator:5432/orchestrator_db
      BANK_ENDPOINTS: bank_a=bank-a:50061,bank_b=bank-b:50062
      LEDGER_ADDR: ledger:50052
      MAX_TRANSFER_AMOUNT: '10000000'
      BANK_CALL_TIMEOUT_MS: '2000'
      LEDGER_CALL_TIMEOUT_MS: '2000'
      INLINE_BANK_RETRIES: '2'
      INLINE_LEDGER_RETRIES: '2'
      SAGA_INLINE_BUDGET_MS: '8000'
      ORCHESTRATOR_TIMEOUT_MS: '10000'
      REPLAY_WAIT_MS: '2000'
      LEASE_MS: '15000'
      RECOVERY_POLL_MS: '1000'
      RECOVERY_BATCH: '20'
      RECOVERY_CONCURRENCY: '5'
      RESOLVE_AFTER_ATTEMPTS: '3'
      MAX_RECOVERY_ATTEMPTS: '20'
      KAFKA_BROKERS: kafka:9092
      OUTBOX_POLL_MS: '500'
    ports:
      - '50051:50051'
      - '9101:9101'
    depends_on:
      postgres-orchestrator:
        condition: service_healthy
      ledger:
        condition: service_healthy
      bank-a:
        condition: service_healthy
      bank-b:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9101/readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # The only public entry point. JWT_SECRET and API_CLIENTS here are development
  # values for the local stack only; a real deployment injects its own.
  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: gateway
      LOG_LEVEL: info
      HTTP_PORT: '8080'
      JWT_SECRET: dev-only-jwt-secret-change-me-0123456789abcdef
      JWT_TTL_SECONDS: '900'
      API_CLIENTS: >-
        [{"client_id":"demo-client","client_secret":"demo-secret"},
        {"client_id":"test-client-a","client_secret":"test-secret-a-dev-only"},
        {"client_id":"test-client-b","client_secret":"test-secret-b-dev-only"},
        {"client_id":"test-ratelimit","client_secret":"test-secret-rl-dev-only"}]
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_RPS: '100'
      RATE_LIMIT_BURST: '200'
      ORCHESTRATOR_ADDR: orchestrator:50051
      ORCHESTRATOR_TIMEOUT_MS: '10000'
      MAX_TRANSFER_AMOUNT: '10000000'
    ports:
      - '8080:8080'
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orchestrator-data:
  ledger-data:
  banks-data:
  kafka-data:
  notification-data:
  reconciliation-data:
