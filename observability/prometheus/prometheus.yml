# Phase 2, item 4 (ARCHITECTURE.md section 19, ADR-028): every service's /metrics.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ['gateway:8080'] }]
  - job_name: orchestrator
    static_configs: [{ targets: ['orchestrator:9101'] }]
  - job_name: ledger
    static_configs: [{ targets: ['ledger:9102'] }]
  - job_name: bank-a
    static_configs: [{ targets: ['bank-a:9111'] }]
  - job_name: bank-b
    static_configs: [{ targets: ['bank-b:9112'] }]
  - job_name: notification
    static_configs: [{ targets: ['notification:9103'] }]
  - job_name: reconciliation
    static_configs: [{ targets: ['reconciliation:9104'] }]
