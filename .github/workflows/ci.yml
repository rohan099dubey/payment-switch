# ARCHITECTURE.md section 17: three jobs.
#   static       every push to main and every pull request (and before nightly)
#   integration  needs static; the real Compose stack, the integration suite, then the
#                1,000-transfer chaos run
#   nightly      schedule and workflow_dispatch; the full 10,000-transfer chaos run
#   k8s          phase 2, item 6 (ADR-030): pull requests, schedule and workflow_dispatch;
#                deploy/k8s on a kind cluster, then the k8s test project
# Details and interpretations: docs/decisions/ADR-023-m9-polish-details.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 02:30 UTC every day.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The event name is part of the group so a nightly run on main never cancels, and is
# never cancelled by, a push to main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: buf lint
        run: npx buf lint

      # Only on pull requests, and only once main has protos to compare against
      # (the PR that introduces proto/ has nothing to break).
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main:main
          if git ls-tree -d main proto >/dev/null 2>&1 && [ -n "$(git ls-tree -d main proto)" ]; then
            npx buf breaking --against '.git#branch=main'
          else
            echo "main has no proto/ directory yet; skipping buf breaking"
          fi

      # Generated code must exist before type-aware lint can resolve imports from it.
      - run: npm run proto:gen

      - run: npm run lint

      - run: npm run build

      - run: npm test

  integration:
    needs: static
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The tests run on the runner and import the generated gRPC code and @switch/common,
      # so the host needs its own build. The images build theirs (.dockerignore).
      - run: npm ci
      - run: npm run build

      - run: npm run stack:up

      - run: npm run test:integration

      - name: chaos (crash recovery + 1,000-transfer invariant test)
        run: npm run test:chaos
        env:
          TRANSFER_COUNT: '1000'

      - name: Collect docker compose logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt 2>&1

      - name: Upload docker compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-integration
          path: compose-logs.txt
          retention-days: 14

      - name: stack:down
        if: always()
        run: npm run stack:down

  nightly:
    needs: static
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: npm run stack:up

      # The full section 16 run, twice with different workload seeds, so every night
      # re-proves the definition-of-done item "passes twice in a row with different
      # seeds". The bank chaos seed stays 42 (spec). Each run also includes the crash
      # recovery test, which is part of the chaos project.
      - name: chaos, 10,000 transfers, TEST_SEED=1
        run: npm run test:chaos
        env:
          TRANSFER_COUNT: '10000'
          TEST_SEED: '1'

      - name: chaos, 10,000 transfers, TEST_SEED=2
        run: npm run test:chaos
        env:
          TRANSFER_COUNT: '10000'
          TEST_SEED: '2'

      - name: npm run invariants (whole fresh stack, unscoped)
        run: npm run invariants

      - name: Collect docker compose logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt 2>&1

      - name: Upload docker compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-nightly
          path: compose-logs.txt
          retention-days: 14

      - name: stack:down
        if: always()
        run: npm run stack:down

  # Phase 2, item 6 (ADR-030): the same stack on Kubernetes. kind is pinned and its checksum
  # verified; the node image is pinned by digest in deploy/kind/cluster.yaml.
  k8s:
    needs: static
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
          rm kind
          kind version
          kubectl version --client

      - run: npm run k8s:up

      - run: npm run test:k8s

      - name: Collect cluster state and logs
        if: failure()
        run: |
          kubectl --context kind-payment-switch -n payment-switch get all,networkpolicy,pvc -o wide > k8s-state.txt 2>&1 || true
          kubectl --context kind-payment-switch -n payment-switch describe pods >> k8s-state.txt 2>&1 || true
          kubectl --context kind-payment-switch get events -A --sort-by=.lastTimestamp >> k8s-state.txt 2>&1 || true
          kubectl --context kind-payment-switch describe nodes >> k8s-state.txt 2>&1 || true
          kind export logs k8s-logs --name payment-switch || true

      - name: Upload cluster state and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-logs
          path: |
            k8s-state.txt
            k8s-logs
          retention-days: 14

      - name: k8s:down
        if: always()
        run: npm run k8s:down
